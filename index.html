<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="search">
        <h1> Job Search</h1>
    </div>

    <div class="container">
        <form id="form">
            <label for="jrole"> Job Role :</label>
            <br>
            <input id="query" type="text" placeholder="Enter Job Role">
            <br> <br>
            <label for="country"> Country Name :</label>
            <br>
            <input id="country" type="text" placeholder="Enter Country (e.g. IN)">
            <br> <br>
            <button id="job-result" type="submit"> Get Job</button>
        </form>

        <h2 id="loading"> Loading Data....</h2>
    </div>
    <div id="display-result"></div>

    <script src="script.js"></script>

</body>

</html>
